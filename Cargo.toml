[package]
name = "armature-http-client"
version = "0.2.1"
edition = "2024"
rust-version = "1.94.1"
autobenches = false  # Disable auto-discovery, use explicit [[bench]] only
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-http-client"
homepage = "https://quinnjr.github.io/armature"
description = "HTTP client with retry, circuit breaker, and timeout support for Armature"
keywords = ["http", "client", "retry", "circuit-breaker", "armature"]
categories = ["web-programming::http-client", "asynchronous"]

[dependencies]
# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip", "brotli", "stream"] }

# Async runtime
tokio = { version = "1.52", features = ["time", "sync"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Tracing
tracing = "0.1"

# Utilities
url = "2.5"
http = "1.4"
bytes = "1.12"
futures = "0.3"
async-trait = "0.1"
parking_lot = "0.12"
base64 = "0.22"
serde_urlencoded = "0.7"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "test-util"] }
tokio-test = "0.4"
wiremock = "0.6"

# Explicit bench targets only: a stray file under benches/ should not silently
# become a target.
[[bench]]
name = "http_client"
harness = false
